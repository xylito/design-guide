<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#181B22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Geometric Frontier Prism -->
  <path d="M32 12 L50 22 L50 42 L32 52 L14 42 L14 22 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Inner Facets -->
  <path d="M32 12 L32 32 L50 42" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32 L14 42" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 32 L32 52" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Core Pulsing Node -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
</svg>
